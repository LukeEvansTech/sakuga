# Local mirror of the super-linter Python linters, on staged files, with the same configs under
# .github/linters/. Without them the tools fall back to their defaults: plain black wraps at 88 and
# rewrites the whole repo. Install once per clone: `lefthook install`. CI stays the authority.

[pre-commit]
parallel = true

[pre-commit.commands.format-python]
run = "uvx isort --quiet --settings-path .github/linters/.isort.cfg {staged_files} && uvx black --quiet --config .github/linters/.python-black {staged_files}"
glob = ["*.py"]
stage_fixed = true
priority = 1

[pre-commit.commands.lint-flake8]
run = "uvx flake8 --config .github/linters/.flake8 {staged_files}"
glob = ["*.py"]

[pre-commit.commands.lint-ruff]
run = "uvx ruff check --config .github/linters/.ruff.toml {staged_files}"
glob = ["*.py"]

[pre-commit.commands.lint-pylint]
run = "uvx pylint --rcfile .github/linters/.python-lint {staged_files}"
glob = ["*.py"]

[pre-commit.commands.lint-mypy]
run = "uvx mypy --config-file .github/linters/mypy.ini {staged_files}"
glob = ["*.py"]
